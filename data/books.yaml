# 本・資料の一覧（本のロードマップ）
# どの本も CiNii または出版社のページで実在と発行年を確認済み（2026-11-24）。
# url は出版社のページ、なければ CiNii。架空の本・未確認の URL は載せない。
#
# - id        : 英小文字とハイフン。nodes.yaml の books から参照する。後から変えない
# - title / author / publisher / year : 書誌情報
# - type      : book（書籍）/ handbook（ハンドブック・公開資料）
# - field     : どの分野の列に置くか（tracks.yaml の id）
# - level     : intro（入門）/ basic（基礎）/ advanced（専門）
# - lang      : ja / en
# - free      : true なら無料で読める
# - next      : この本の次に読むとよい本の id（読む順の矢印になる）
# - note      : ひとこと
# - candidate : true なら「候補」（調べて挙げただけで、チームで確定していない）

